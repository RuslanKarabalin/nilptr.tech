# Identity used by GitHub Actions to deploy into the nilptr namespace.
# Applied once by the cluster owner. Then run
# deploy/scripts/make-kubeconfig.sh to produce the kubeconfig for the
# repository secret KUBECONFIG.
#
# The Role deliberately has no access to Secrets: secrets are created by
# hand and CI only references them by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer
  namespace: nilptr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: nilptr
rules:
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "controllerrevisions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["traefik.io"]
    resources: ["middlewares"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer
  namespace: nilptr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
subjects:
  - kind: ServiceAccount
    name: deployer
    namespace: nilptr
---
# Long-lived token for the ServiceAccount. Kubernetes fills in the token
# and ca.crt. Delete and re-apply this Secret to rotate the token.
apiVersion: v1
kind: Secret
metadata:
  name: deployer-token
  namespace: nilptr
  annotations:
    kubernetes.io/service-account.name: deployer
type: kubernetes.io/service-account-token
