# Garage S3 storage, single node, metadata and data on the node disk via
# local-path. Reachable only inside the namespace (see
# networkpolicies.yaml).
#
# A fresh Garage has no cluster layout and answers 503 on /health until
# the layout is applied. The layout, the bucket and the access key are
# created by deploy/scripts/garage-init.sh, which runs as the first init
# container of the backend-migrate Job on every deploy (idempotent).
# Until then the pod is not Ready, so the init script talks to the admin
# API through the garage-headless Service, which publishes not ready
# addresses.
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: nilptr
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: nilptr
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
---
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: nilptr
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: nilptr
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: rpc
      port: 3901
      targetPort: rpc
    - name: admin
      port: 3903
      targetPort: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: nilptr
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: nilptr
spec:
  serviceName: garage-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
        app.kubernetes.io/part-of: nilptr
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.4.1
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: admin
              containerPort: 3903
          envFrom:
            - secretRef:
                name: garage
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # /health is 200 only when the layout is applied and all
          # partitions have quorum, so it gates readiness. Liveness only
          # checks that the process listens, otherwise a fresh node would be
          # restarted forever before the init step runs.
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
      volumes:
        - name: config
          configMap:
            name: garage-config
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
