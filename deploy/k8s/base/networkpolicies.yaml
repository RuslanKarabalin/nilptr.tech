# NetworkPolicies, enforced by the network policy controller built into
# k3s (kube-router). Traffic from the node itself (kubelet probes,
# kubectl port-forward and exec) is always allowed by kube-router.
#
# Who talks to whom:
#   Traefik (kube-system) -> frontend:3000, backend:8080
#   frontend              -> backend:8080
#   backend               -> postgres:5432, garage:3900
#   backend-migrate Job   -> postgres:5432, garage admin 3903 (init)
#   backup CronJob        -> postgres:5432, garage:3900, external S3
---
# Deny all ingress to every pod in the namespace unless allowed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nilptr
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: nilptr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # The frontend only reaches the backend (and DNS).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: nilptr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frontend
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
      ports:
        - port: 3900
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: nilptr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["backend", "backend-migrate", "backup"]
      ports:
        - port: 5432
          protocol: TCP
  # No egress at all.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garage
  namespace: nilptr
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garage
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # S3 API: backend and backup only.
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["backend", "backup"]
      ports:
        - port: 3900
          protocol: TCP
    # Admin API: only from pods inside the namespace (garage-init runs in
    # the backend-migrate Job).
    - from:
        - podSelector: {}
      ports:
        - port: 3903
          protocol: TCP
  # Single node: the RPC port only talks to itself over loopback, which
  # NetworkPolicy does not filter. No other egress is needed.
  egress: []
