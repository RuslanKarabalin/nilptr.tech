# EXAMPLE ONLY. Never commit real values. External S3-compatible storage
# that receives backups (Backblaze B2, Cloudflare R2, Hetzner, AWS S3, ...).
# Create the real Secret by hand:
#
#   kubectl -n nilptr create secret generic backup-target \
#     --from-literal=BACKUP_S3_ENDPOINT=https://s3.eu-central-003.backblazeb2.com \
#     --from-literal=BACKUP_S3_REGION=eu-central-003 \
#     --from-literal=BACKUP_S3_BUCKET=nilptr-backup \
#     --from-literal=BACKUP_S3_ACCESS_KEY=... \
#     --from-literal=BACKUP_S3_SECRET_KEY=...
#
# The bucket must already exist. Give the key access to this bucket only.
apiVersion: v1
kind: Secret
metadata:
  name: backup-target
  namespace: nilptr
type: Opaque
stringData:
  BACKUP_S3_ENDPOINT: https://s3.example.com
  BACKUP_S3_REGION: us-east-1
  BACKUP_S3_BUCKET: nilptr-backup
  BACKUP_S3_ACCESS_KEY: CHANGE-ME
  BACKUP_S3_SECRET_KEY: CHANGE-ME
