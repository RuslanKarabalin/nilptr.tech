# EXAMPLE ONLY. Pull secret for private ghcr.io packages. Create it with a
# GitHub personal access token (classic) that has only read:packages:
#
#   kubectl -n nilptr create secret docker-registry ghcr-pull \
#     --docker-server=ghcr.io \
#     --docker-username=ruslankarabalin \
#     --docker-password=<token with read:packages>
#
# If the packages are public the Secret is not required, but the
# Deployments reference it, so creating it is harmless and recommended.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: nilptr
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths": {"ghcr.io": {"auth": "BASE64-OF-USERNAME:TOKEN"}}}
