# EXAMPLE ONLY. Never commit real values. Create the real Secret with
# deploy/scripts/create-secrets.sh or by hand:
#
#   kubectl -n nilptr create secret generic postgres \
#     --from-literal=POSTGRES_USER=nilptr \
#     --from-literal=POSTGRES_DB=nilptr \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)"
#
# The password is used only on the first start of an empty volume. Changing
# it later requires ALTER ROLE inside the database as well.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: nilptr
type: Opaque
stringData:
  POSTGRES_USER: nilptr
  POSTGRES_DB: nilptr
  POSTGRES_PASSWORD: CHANGE-ME
