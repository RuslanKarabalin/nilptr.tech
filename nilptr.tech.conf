server {
    listen 80;
    listen [::]:80;
    server_name nilptr.tech www.nilptr.tech;

    root /var/www/nilptr.tech;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.svg {
        access_log off;
        log_not_found off;
        expires 7d;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
